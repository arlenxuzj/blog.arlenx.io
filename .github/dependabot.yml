version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Keep the MIT-licensed 2.x series; 3.x changes licensing.
      - dependency-name: typed.js
        update-types: ["version-update:semver-major"]
    groups:
      maintenance:
        patterns:
          - "*"
        exclude-patterns:
          - eslint
          - "@eslint/js"
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
